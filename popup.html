<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Stack</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="url(#lightning-grad)" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="lightning-grad" x1="3" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6366F1"/>
              <stop offset="1" stop-color="#A855F7"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="brand-title">
          <h1>Context Stack</h1>
          <span class="shortcut-hint" title="Atajo de teclado global">Alt+S</span>
        </div>
      </div>
      <div class="header-right">
        <button id="toggleItemsBtn" class="icon-btn" title="Ver lista de ítems / eliminar individuales">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </button>
        <button id="toggleSettingsBtn" class="icon-btn" title="Opciones de Jina AI y deduplicación">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <div class="item-badge" id="itemCountBadge">0 URLs</div>
      </div>
    </header>

    <!-- Quick Action Buttons -->
    <section class="actions-bar">
      <button id="addCurrentBtn" class="btn btn-primary" title="Capturar pestaña actual">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span>Pestaña Actual</span>
      </button>
      <button id="addAllBtn" class="btn btn-secondary" title="Capturar todas las pestañas de la ventana">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>Todas las Pestañas</span>
      </button>
    </section>

    <!-- Format Selector -->
    <section class="format-section">
      <label for="formatSelect" class="format-label">Formato:</label>
      <div class="select-wrapper">
        <select id="formatSelect" class="format-select">
          <option value="markdown">📝 Markdown Links ([Título](URL))</option>
          <option value="urls">🔗 Solo URLs (https://r.jina.ai/...)</option>
          <option value="llm_prompt">🤖 Prompt LLM Listo ("Analiza...")</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </section>

    <!-- Main View: Notepad -->
    <section class="notepad-section" id="notepadView">
      <textarea id="notepad" class="notepad-textarea" spellcheck="false" placeholder="Las URLs capturadas con Jina AI (https://r.jina.ai/) aparecerán aquí...&#10;&#10;Sugerencia: Presiona Alt+S (o Command+Shift+S en Mac) en cualquier pestaña para capturarla en segundo plano."></textarea>
      <div class="notepad-status">
        <span id="statsText">0 caracteres | 0 líneas</span>
        <span class="sync-indicator" id="syncIndicator">Sincronizado ✓</span>
      </div>
    </section>

    <!-- Items List View (Hidden by default) -->
    <section class="items-view hidden" id="itemsView">
      <div class="view-header">
        <h3>Lista de URLs Capturadas</h3>
        <button id="closeItemsViewBtn" class="btn-text">Volver al Notepad</button>
      </div>
      <div class="items-list" id="itemsList">
        <!-- Rendered items list -->
      </div>
    </section>

    <!-- Settings View (Hidden by default) -->
    <section class="settings-view hidden" id="settingsView">
      <div class="view-header">
        <h3>Opciones de Jina AI & Filtros</h3>
        <button id="closeSettingsViewBtn" class="btn-text">Guardar y Volver</button>
      </div>
      <div class="settings-content">
        <label class="setting-row">
          <input type="checkbox" id="deduplicateCheck">
          <span>Omitir URLs duplicadas automáticamente</span>
        </label>
        <label class="setting-row">
          <input type="checkbox" id="jinaNoImagesCheck">
          <span>Jina: Omitir imágenes (ahorra tokens)</span>
        </label>
        <label class="setting-row">
          <input type="checkbox" id="jinaLinksSummaryCheck">
          <span>Jina: Incluir resumen de enlaces al final</span>
        </label>
      </div>
    </section>

    <!-- Tools Secondary Bar -->
    <section class="tools-bar">
      <button id="downloadMdBtn" class="btn btn-tool" title="Descargar como archivo .md">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>Descargar .md</span>
      </button>

      <div class="llm-dropdown-wrapper">
        <button id="openLlmBtn" class="btn btn-tool btn-llm" title="Copiar y abrir en tu LLM preferido">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          <span>Abrir en LLM ▾</span>
        </button>
        <div class="llm-menu hidden" id="llmMenu">
          <button data-url="https://chatgpt.com" class="llm-menu-item">🤖 ChatGPT</button>
          <button data-url="https://claude.ai" class="llm-menu-item">🔮 Claude</button>
          <button data-url="https://gemini.google.com" class="llm-menu-item">✨ Gemini</button>
          <button data-url="https://chat.deepseek.com" class="llm-menu-item">🐋 DeepSeek</button>
        </div>
      </div>
    </section>

    <!-- Bottom Action Bar -->
    <footer class="app-footer">
      <button id="copyBtn" class="btn btn-success" title="Copiar todo el contenido al portapapeles">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span id="copyBtnText">Copiar Todo</span>
      </button>
      <button id="clearBtn" class="btn btn-danger" title="Limpiar todas las notas y vaciar la lista">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        <span>Limpiar</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
